# Idle policy tuned for an OLED panel: dim early, lock, then switch the panel off.
general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = ~/.config/hypr/scripts/screen.sh on
    ignore_dbus_inhibit = false     # video playback / calls keep the screen awake
}

# 1 min: dim to a third
listener {
    timeout = 60
    on-timeout = ~/.config/hypr/scripts/dim.sh
    on-resume = brightnessctl -r
}

# 2 min: lock
listener {
    timeout = 120
    on-timeout = loginctl lock-session
}

# 2.5 min: panel off
listener {
    timeout = 150
    on-timeout = ~/.config/hypr/scripts/screen.sh off
    on-resume = ~/.config/hypr/scripts/screen.sh on
}

# 15 min: suspend (battery only)
listener {
    timeout = 900
    on-timeout = ~/.config/hypr/scripts/suspend-on-battery.sh
}
