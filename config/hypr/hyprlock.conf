# Dark, dim, minimal. Everything static is low-luminance (OLED).
general {
    hide_cursor = true
    ignore_empty_input = true
}

animations {
    enabled = true
    bezier = smooth, 0.16, 1, 0.3, 1
    animation = fadeIn, 1, 4, smooth
    animation = fadeOut, 1, 4, smooth
    animation = inputFieldDots, 1, 2, smooth
}

background {
    monitor =
    path = ~/.config/hypr/current-wallpaper
    blur_passes = 2
    blur_size = 6
    brightness = 0.55
    vibrancy = 0.0
}

# time
label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%H:%M')"
    color = rgba(220, 220, 222, 0.92)
    font_size = 108
    font_family = Inter Light
    position = 0, 190
    halign = center
    valign = center
}

# date
label {
    monitor =
    text = cmd[update:60000] echo "$(date +'%A %-d %B')"
    color = rgba(132, 132, 138, 1.0)
    font_size = 18
    font_family = Inter
    position = 0, 100
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 300, 52
    outline_thickness = 1
    dots_size = 0.24
    dots_spacing = 0.35
    dots_center = true
    outer_color = rgba(255, 255, 255, 0.14)
    inner_color = rgba(0, 0, 0, 0.55)
    font_color = rgb(220, 220, 222)
    check_color = rgba(220, 220, 222, 0.5)
    fail_color = rgba(229, 72, 77, 0.9)
    fade_on_empty = true
    fade_timeout = 2500
    rounding = 26
    placeholder_text = <span foreground="##84848a">Password</span>
    fail_text = <span foreground="##e5484d">Wrong password</span>
    hide_input = false
    position = 0, -60
    halign = center
    valign = center
}
